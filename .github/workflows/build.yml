name: Build updater
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash build.sh
      - run: cd out && zip -r ../nebula-updater.zip nebula-updater.jar "Nebula Updater.bat" updater.json README.md
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-updater
          path: |
            out/nebula-updater.jar
            nebula-updater.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/nebula-updater.jar
            nebula-updater.zip
